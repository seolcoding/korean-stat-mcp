name: Feature Request
description: 새로운 기능을 제안합니다 / Suggest a new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 기능 제안 / Feature Request

        **한국어:** 아이디어를 공유해 주셔서 감사합니다. 어떤 문제를 해결하려는지부터 설명해 주세요.
        **English:** Thanks for sharing an idea. Please start by describing the problem you're trying to solve.

  - type: textarea
    id: problem
    attributes:
      label: 문제 / 사용 사례 / Problem or use case
      description: 어떤 상황에서 이 기능이 필요한지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책 / Proposed solution
      description: 어떻게 동작하면 좋을지 아이디어가 있다면 적어주세요.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안 / Alternatives considered
      description: 다른 방법을 고려해 봤다면 공유해 주세요.
    validations:
      required: false

  - type: input
    id: kosis-endpoint
    attributes:
      label: 관련 KOSIS 엔드포인트 / Related KOSIS endpoint(s)
      description: "예: statisticsParameterData.do, statisticsList.do"
      placeholder: statisticsParameterData.do
    validations:
      required: false
