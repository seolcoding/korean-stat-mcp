name: deploy

on:
  workflow_run:
    workflows: ["CI"]   # exact name in .github/workflows/ci.yml
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Gate 1: full pytest re-run
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --dev
      - run: uv run pytest -q

      # Gate 2: build the production Docker image (same artifact that ships)
      - run: docker build -t korean-stat-mcp:ci .

      # Gate 3: container smoke test
      - name: Container smoke test
        run: |
          set -eu

          # Clean any leftover container from a prior run (--rm + stop has a
          # race where the next run can hit a name collision).
          docker rm -f kstat-smoke-env 2>/dev/null || true
          docker rm -f kstat-smoke-noenv 2>/dev/null || true

          # Stage 1: env-based key path. /health and /info must succeed.
          docker run -d --rm --name kstat-smoke-env -p 8000:8000 \
            -e KOSIS_API_KEY=ci-fake-key korean-stat-mcp:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/info | grep -q "korean-stat-mcp"
          docker rm -f kstat-smoke-env

          # Stage 2: no env, no ?apiKey= -> /mcp returns 401 missing_api_key.
          docker run -d --rm --name kstat-smoke-noenv -p 8000:8000 korean-stat-mcp:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health >/dev/null; then break; fi
            sleep 1
          done
          code=$(curl -s -o /tmp/body -w "%{http_code}" -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          test "$code" = "401"
          grep -q '"missing_api_key"' /tmp/body
          docker rm -f kstat-smoke-noenv

      # Gate 4: deploy
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Gate 5: post-deploy health probe (uses fly.dev hostname; DNS comes
      # online in the manual cutover step in spec section 15)
      - name: Post-deploy health probe
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://korean-stat-mcp.fly.dev/health; then exit 0; fi
            sleep 2
          done
          echo "post-deploy health probe failed"; exit 1
