name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Lint scope is intentionally narrowed to library code (src/kosis_tools,
      # src/mcp_server). Pre-existing legacy paths (src/scripts/, tests/) have
      # accumulated lint debt that will be addressed in a separate cleanup pass.
      - name: Lint (ruff check)
        run: uv run ruff check src/kosis_tools src/mcp_server

      - name: Format check (ruff format)
        run: uv run ruff format --check src/kosis_tools src/mcp_server

      - name: Release metadata check
        run: uv run python scripts/validation/check_release_readiness.py --quiet

      - name: Type check (mypy, non-blocking)
        run: uv run mypy src/kosis_tools src/mcp_server || true

      - name: Unit tests (pytest)
        run: uv run pytest -q tests/unit -m "not network"
