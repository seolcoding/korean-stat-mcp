# fly.toml - Fly.io deployment for korean-stat-mcp
# Region nrt (Tokyo) keeps RTT to Korean users in the 30-50ms range.

app = "korean-stat-mcp"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  FASTMCP_STATELESS_HTTP = "true"
  PYTHONUNBUFFERED = "1"
  RATE_LIMIT_RPM = "300"
  # Cap KOSIS upstream timing so the worst case (1 attempt + 1 retry + delay)
  # stays under Fly's 60s HTTP proxy timeout. Defaults (60s timeout × 3 retries)
  # could accumulate to 184s and surface as 502/503 to the client.
  # Worst case here: 25 + 1 + 25 = 51s.
  KOSIS_TIMEOUT = "25"
  KOSIS_MAX_RETRIES = "1"
  KOSIS_RETRY_DELAY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # Suspend (instead of stop) preserves the running process state, so warm
  # starts are sub-second; falls back to a true cold start only after long
  # idleness. Keeps the cost-control benefit of scale-to-zero.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb keeps headroom for asyncio + json5 parsing on large KOSIS payloads.
  # If memory metrics show steady RSS < 200MB after the soak, downsize to 256.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
