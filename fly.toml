# fly.toml - Fly.io deployment for korean-stat-mcp
# Region nrt (Tokyo) keeps RTT to Korean users in the 30-50ms range.

app = "korean-stat-mcp"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  FASTMCP_STATELESS_HTTP = "true"
  PYTHONUNBUFFERED = "1"
  RATE_LIMIT_RPM = "300"
  # Cap KOSIS upstream timing so the worst case stays well under Fly's 60s
  # HTTP proxy timeout. Tuning rationale:
  #
  # Observed: get_statistics_data routinely hits ~28s because the first
  # KOSIS connection after a Fly suspend-resume gets reset by KOSIS, and
  # we then wait the full timeout before retrying.
  #
  # New budget: 10 + 1 + 10 + 2 + 10 = 33s worst-case (3 attempts), but
  # the common case (one reset, second attempt succeeds) lands at ~12s
  # instead of ~28s. The lifespan KOSIS warm-up in app.py also reduces
  # how often the first-attempt reset hits at all.
  KOSIS_TIMEOUT = "10"
  KOSIS_MAX_RETRIES = "2"
  KOSIS_RETRY_DELAY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # Suspend (instead of stop) preserves the running process state, so warm
  # starts are sub-second; falls back to a true cold start only after long
  # idleness. Keeps the cost-control benefit of scale-to-zero.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb keeps headroom for asyncio + json5 parsing on large KOSIS payloads.
  # If memory metrics show steady RSS < 200MB after the soak, downsize to 256.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
