# fly.toml - Fly.io deployment for korean-stat-mcp
# This is a TEMPLATE. App name `korean-stat-mcp` is a placeholder; pick an
# available one with `fly launch --no-deploy` or `fly apps create <name>`.
# Region `nrt` (Tokyo) is closest to Korea; change if your users are elsewhere.

app = "korean-stat-mcp"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  # Public, non-secret defaults. Sensitive values (KOSIS_API_KEY) must be
  # set via `fly secrets set KOSIS_API_KEY=...` (see deploy/README.md).
  FASTMCP_STATELESS_HTTP = "true"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Cost control: scale to zero when idle.
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
