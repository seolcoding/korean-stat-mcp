<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSIS Report Debug Viewer</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --sidebar-bg: #2d3748;
            --sidebar-hover: #4a5568;
            --sidebar-active: #667eea;
            --main-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --tab-active: #667eea;
            --tab-inactive: #cbd5e0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-gradient);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow);
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .container {
            display: flex;
            height: calc(100vh - 80px);
            margin: 1rem;
            gap: 1rem;
        }

        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow-y: auto;
            padding: 1rem;
        }

        .sidebar h2 {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .report-list {
            list-style: none;
        }

        .report-item {
            padding: 0.875rem 1rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            border-radius: 8px;
            color: #e2e8f0;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .report-item:hover {
            background: var(--sidebar-hover);
            color: #ffffff;
            transform: translateX(4px);
        }

        .report-item.active {
            background: var(--sidebar-active);
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }

        .main-panel {
            flex: 1;
            background: var(--main-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            background: #f7fafc;
            padding: 0 1rem;
        }

        .tab-button {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-button:hover {
            color: var(--text-primary);
            background: rgba(102, 126, 234, 0.05);
        }

        .tab-button.active {
            color: var(--tab-active);
            border-bottom-color: var(--tab-active);
        }

        .tab-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-pane {
            display: none;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .tab-pane.active {
            display: block;
            flex: 1;
        }

        /* Result 탭은 패딩 없이 전체 공간 사용 */
        #resultTab {
            padding: 0;
            overflow: hidden;
        }

        #resultTab.active {
            display: flex;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1.125rem;
            font-weight: 500;
        }

        .prompt-content,
        .thinking-content,
        .flow-content {
            background: #f7fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .prompt-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .json-tree {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.875rem;
        }

        .json-key {
            color: #0066cc;
            font-weight: 600;
        }

        .json-string {
            color: #009900;
        }

        .json-number {
            color: #cc6600;
        }

        .json-boolean {
            color: #cc0066;
        }

        .json-null {
            color: #999999;
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            padding: 1rem 0 1rem 1.5rem;
            margin-bottom: 1rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.375rem;
            top: 1.25rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--tab-active);
            border: 3px solid var(--main-bg);
            box-shadow: 0 0 0 2px var(--tab-active);
        }

        .timeline-step {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .timeline-detail {
            color: var(--text-secondary);
            font-size: 0.875rem;
            background: #f7fafc;
            padding: 0.75rem;
            border-radius: 6px;
            border-left: 3px solid var(--tab-active);
        }

        .result-iframe {
            width: 100%;
            height: 100%;
            flex: 1;
            border: none;
            background: white;
        }

        .error-message {
            background: #fff5f5;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '...';
            animation: loading 1.5s infinite;
        }

        .loading-sidebar {
            color: #e2e8f0;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .category-header {
            color: #a0aec0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            border-top: 1px solid #4a5568;
        }

        .category-header:first-child {
            margin-top: 0;
            border-top: none;
        }

        @keyframes loading {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>KOSIS Report Debug Viewer</h1>
    </div>

    <div class="container">
        <aside class="sidebar">
            <h2>Reports</h2>
            <div id="loadingReports" class="loading-sidebar">Loading...</div>
            <ul class="report-list" id="reportList"></ul>
        </aside>

        <main class="main-panel">
            <div class="tabs">
                <button class="tab-button active" data-tab="prompt">Prompt</button>
                <button class="tab-button" data-tab="thinking">Thinking</button>
                <button class="tab-button" data-tab="flow">Code Flow</button>
                <button class="tab-button" data-tab="result">Result</button>
            </div>

            <div class="tab-content">
                <div class="tab-pane active" id="promptTab">
                    <div class="empty-state">
                        <div class="empty-state-icon">📄</div>
                        <div class="empty-state-text">Select a report to view</div>
                    </div>
                </div>

                <div class="tab-pane" id="thinkingTab">
                    <div class="empty-state">
                        <div class="empty-state-icon">🧠</div>
                        <div class="empty-state-text">Select a report to view</div>
                    </div>
                </div>

                <div class="tab-pane" id="flowTab">
                    <div class="empty-state">
                        <div class="empty-state-icon">⚙️</div>
                        <div class="empty-state-text">Select a report to view</div>
                    </div>
                </div>

                <div class="tab-pane" id="resultTab">
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">Select a report to view</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // State management
        let currentReport = null;
        let debugData = null;
        let reports = [];

        // DOM elements
        const reportList = document.getElementById('reportList');
        const loadingReports = document.getElementById('loadingReports');
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabPanes = document.querySelectorAll('.tab-pane');

        // Initialize
        async function init() {
            await loadManifest();
            setupTabs();
        }

        // Load manifest.json
        async function loadManifest() {
            try {
                const response = await fetch('output/manifest.json');
                if (!response.ok) {
                    throw new Error('manifest.json not found');
                }
                const manifest = await response.json();
                reports = manifest.reports || [];
                renderReportList();
                loadingReports.style.display = 'none';

                // Auto-load first report
                if (reports.length > 0) {
                    loadReport(reports[0].id);
                }
            } catch (error) {
                loadingReports.innerHTML = `
                    <p>No reports found</p>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem;">
                        Run: <code>uv run python generate_debug_reports.py</code>
                    </p>
                `;
            }
        }

        // Render report list grouped by category
        function renderReportList() {
            const grouped = {};
            reports.forEach(report => {
                const cat = report.category || 'Other';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(report);
            });

            let html = '';
            for (const [category, items] of Object.entries(grouped)) {
                html += `<li class="category-header">${category}</li>`;
                items.forEach(report => {
                    html += `<li class="report-item" data-report="${report.id}">${report.name}</li>`;
                });
            }

            reportList.innerHTML = html;

            // Add click handlers
            reportList.querySelectorAll('.report-item').forEach(item => {
                item.addEventListener('click', () => {
                    const reportId = item.dataset.report;
                    loadReport(reportId);

                    // Update active state
                    reportList.querySelectorAll('.report-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                });
            });
        }

        // Tab switching
        function setupTabs() {
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const tabName = button.dataset.tab;
                    switchTab(tabName);
                });
            });
        }

        function switchTab(tabName) {
            // Update tab buttons
            tabButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });

            // Update tab panes
            tabPanes.forEach(pane => {
                pane.classList.toggle('active', pane.id === `${tabName}Tab`);
            });
        }

        // Load report data
        async function loadReport(reportId) {
            currentReport = reportId;

            // Update sidebar active state
            reportList.querySelectorAll('.report-item').forEach(item => {
                item.classList.toggle('active', item.dataset.report === reportId);
            });

            // Show loading state
            showLoading();

            try {
                // Load debug JSON
                const debugResponse = await fetch(`output/${reportId}.debug.json`);
                if (!debugResponse.ok) {
                    throw new Error(`Failed to load debug data: ${debugResponse.statusText}`);
                }
                debugData = await debugResponse.json();

                // Render all tabs
                renderPromptTab();
                renderThinkingTab();
                renderFlowTab();
                renderResultTab(reportId);

            } catch (error) {
                showError(error.message);
            }
        }

        // Render Prompt tab
        function renderPromptTab() {
            const promptTab = document.getElementById('promptTab');
            const userQuery = debugData.user_query || 'No query available';

            promptTab.innerHTML = `
                <div class="prompt-content">${escapeHtml(userQuery)}</div>
            `;
        }

        // Render Thinking tab
        function renderThinkingTab() {
            const thinkingTab = document.getElementById('thinkingTab');
            const parsedQuery = debugData.parsed_query || {};

            thinkingTab.innerHTML = `
                <div class="thinking-content">
                    <div class="json-tree">${renderJSON(parsedQuery)}</div>
                </div>
            `;
        }

        // Render Code Flow tab
        function renderFlowTab() {
            const flowTab = document.getElementById('flowTab');
            const steps = debugData.processing_steps || [];

            if (steps.length === 0) {
                flowTab.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚙️</div>
                        <div class="empty-state-text">No processing steps available</div>
                    </div>
                `;
                return;
            }

            const timeline = steps.map((step, index) => `
                <div class="timeline-item">
                    <div class="timeline-step">Step ${index + 1}: ${escapeHtml(step.step || 'Unknown')}</div>
                    <div class="timeline-detail">${escapeHtml(step.detail || 'No details')}</div>
                </div>
            `).join('');

            flowTab.innerHTML = `
                <div class="flow-content">
                    <div class="timeline">${timeline}</div>
                </div>
            `;
        }

        // Render Result tab
        function renderResultTab(reportId) {
            const resultTab = document.getElementById('resultTab');

            resultTab.innerHTML = `
                <iframe class="result-iframe" src="output/${reportId}.html"></iframe>
            `;
        }

        // JSON renderer
        function renderJSON(obj, indent = 0) {
            const indentStr = '  '.repeat(indent);

            if (obj === null) {
                return `<span class="json-null">null</span>`;
            }

            if (typeof obj === 'string') {
                return `<span class="json-string">"${escapeHtml(obj)}"</span>`;
            }

            if (typeof obj === 'number') {
                return `<span class="json-number">${obj}</span>`;
            }

            if (typeof obj === 'boolean') {
                return `<span class="json-boolean">${obj}</span>`;
            }

            if (Array.isArray(obj)) {
                if (obj.length === 0) return '[]';

                const items = obj.map(item =>
                    `${indentStr}  ${renderJSON(item, indent + 1)}`
                ).join(',\n');

                return `[\n${items}\n${indentStr}]`;
            }

            if (typeof obj === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) return '{}';

                const items = keys.map(key =>
                    `${indentStr}  <span class="json-key">"${escapeHtml(key)}"</span>: ${renderJSON(obj[key], indent + 1)}`
                ).join(',\n');

                return `{\n${items}\n${indentStr}}`;
            }

            return String(obj);
        }

        // Helper functions
        function showLoading() {
            tabPanes.forEach(pane => {
                pane.innerHTML = '<div class="loading">Loading</div>';
            });
        }

        function showError(message) {
            tabPanes.forEach(pane => {
                pane.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> ${escapeHtml(message)}
                    </div>
                `;
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
