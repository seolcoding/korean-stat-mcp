[project]
name = "kosis-mcp"
version = "0.1.0"
description = "KOSIS(국가통계포털) MCP Server - Korean Statistical Data API Tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "SDH", email = "sdh@example.com" }
]
keywords = ["kosis", "mcp", "statistics", "korea", "llm", "claude", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastmcp>=2.14.0",
    "requests>=2.32.4",
    "pandas>=2.3.0",
    "altair>=5.5.0",
    "vl-convert-python>=1.7.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.1",
    "bs4>=0.0.2",
    "json5>=0.12.1",
    "pymupdf>=1.26.7",
    "xlrd>=2.0.2",
    "aiohttp>=3.13.2",
    "fastapi>=0.124.4",
    "uvicorn>=0.38.0",
    # Phase 3: Database & Storage
    "asyncpg>=0.30.0",
    "openai>=1.58.0",
    "boto3>=1.36.0",
]

[project.urls]
Homepage = "https://github.com/seolcoding/kosis-mcp"
Documentation = "https://github.com/seolcoding/kosis-mcp#readme"
Repository = "https://github.com/seolcoding/kosis-mcp"

[project.scripts]
kosis-mcp = "mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "responses>=0.25.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
