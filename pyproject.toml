[project]
name = "korean-stat-mcp"
version = "0.1.3"
description = "MCP server for Korean KOSIS OpenAPI statistics data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "korean-stat-mcp maintainers" }
]
keywords = ["kosis", "mcp", "statistics", "korea", "python", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastmcp>=2.14.0",
    "requests>=2.32.4",
    "pandas>=2.3.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.1",
    "bs4>=0.0.2",
    "json5>=0.12.1",
    "xlrd>=2.0.2",
    "aiohttp>=3.13.2",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
# Optional: PostgreSQL backend for FTS-based metadata search and load_metadata script
postgres = [
    "asyncpg>=0.30.0",
]
# Convenience: install all optional extras
all = [
    "asyncpg>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/seolcoding/korean-stat-mcp"
Documentation = "https://github.com/seolcoding/korean-stat-mcp#readme"
Repository = "https://github.com/seolcoding/korean-stat-mcp"
"Bug Tracker" = "https://github.com/seolcoding/korean-stat-mcp/issues"

[project.scripts]
korean-stat-mcp = "mcp_server.server:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "responses>=0.25.8",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kosis_tools", "kosis_tools.*", "mcp_server", "mcp_server.*"]
exclude = ["scripts", "scripts.*"]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
