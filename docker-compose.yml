services:
  # Optional PostgreSQL for FTS-based metadata search
  postgres:
    image: postgres:16
    container_name: korean-stat-postgres
    environment:
      POSTGRES_USER: kosis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kosis_dev_password}
      POSTGRES_DB: kosis
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosis -d kosis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # korean-stat-mcp HTTP server
  korean-stat-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korean-stat-mcp
    ports:
      - "8000:8000"
    environment:
      # FastMCP
      - FASTMCP_STATELESS_HTTP=true
      # KOSIS API
      - KOSIS_API_KEY=${KOSIS_API_KEY}
      # PostgreSQL (asyncpg format)
      - DATABASE_URL=postgresql://kosis:${POSTGRES_PASSWORD:-kosis_dev_password}@postgres:5432/kosis
      # Local artifacts
      - KOSIS_ARTIFACTS_DIR=/app/artifacts
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: korean-stat-network
